name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET dependencies
        run: dotnet restore --locked-mode

      - name: Build .NET
        run: dotnet build

      - name: Test .NET
        run: dotnet test --no-build --verbosity normal
